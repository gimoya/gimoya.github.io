<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apps · Tirol Trailhead</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root { --bg:#0b0c10; --card:#15171c; --text:#e8eef2; --muted:#9aa4af; --accent:#4cc9f0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 40px 20px 10px; text-align:center; }
    header h1 { margin: 0 0 6px; font-weight:700; letter-spacing:0.5px; }
    header p { margin: 0; color: var(--muted); }
    .grid { display:grid; gap:16px; padding:24px; max-width:1100px; margin:0 auto; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .card { display:block; background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:18px 18px 16px; text-decoration:none; color: inherit; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; backdrop-filter: blur(6px); }
    .card:hover { transform: translateY(-2px); border-color: rgba(76,201,240,0.5); box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
    .card h3 { margin: 0 0 8px; font-size: 18px; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height:1.35; }
    footer { text-align:center; padding: 24px; color: var(--muted); }
    .pill { display:inline-block; font-size:12px; color:#0b0c10; background:var(--accent); border-radius:999px; padding:3px 10px; font-weight:600; margin-bottom:10px; }
  </style>
</head>
<body>
  <header>
    <div class="pill">Apps</div>
    <h1>Project Apps</h1>
    <p>Links served under tiroltrailhead.com</p>
  </header>
  <main class="grid">
    <a class="card" href="https://tiroltrailhead.com/TheHunt25">
      <h3>TheHunt25</h3>
      <p>Route viewer and related assets.</p>
    </a>
    <a class="card" href="https://tiroltrailhead.com/osm_trail_search">
      <h3>OSM Trail Search</h3>
      <p>OpenStreetMap-based trail search UI.</p>
    </a>
    <a class="card" href="https://tiroltrailhead.com/noexif_geotagging">
      <h3>NoEXIF Geotagging</h3>
      <p>Privacy-minded media geotagging utilities.</p>
    </a>
  </main>
  <footer>
    <small>© Tirol Trailhead</small>
  </footer>
</body>
</html>
