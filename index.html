<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",

    "address": {
      "@type": "PostalAddress",

    },

    ],
    "service": [
      {
        "@type": "Service",
        "name": "MTB Guiding",
        "description": "Professional mountain bike guidance services"

      {
        "@type": "Service", 
        "name": "Trail Planning Consulting",

      }
    ]
  }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    
    .footer-links {
      color: #ffa500;
      font-family: 'new courier', Consolas, sans-serif;
      text-align: center;
      padding: 24px;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    .footer-links a {
      color: #fff200;
      font-weight: bold;
      text-decoration: none;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    body {
      min-height: 100vh;
      width: 100vw;
      background: #111;
      color: #fff;
      font-family: 'Oswald', Arial, sans-serif;
      letter-spacing: 0.25em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .bg-video, .bg-image {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      width: 100vw;
      max-width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin: 0 0 0.5em 0;
      text-shadow: 0 2px 16px #000;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      margin: 2.5em auto 0 auto;
    }
    .btn {
      background: #222;
      color: #fff;
      border: none;
      border-radius: 0;
      padding: 1.2em 3em;
      font-size: 1.2rem;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      box-shadow: 0 2px 16px #0008;
      text-transform: uppercase;
      outline: none;
      display: inline-block;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .btn.btn-light {
      background: #fff;
      color: #111;
      border: 1px solid #e6e6e6;
      box-shadow: 0 2px 14px #0004;
    }
    .btn.btn-light:hover, .btn.btn-light:focus {
      background: #f2f2f2;
      color: #000;
    }
    /* Secondary link section under main buttons */
    .subnav {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin: 1.25rem 0 0;
      width: 100%;
      padding: 0 12px;
    }
    .btn-sub {
      background: rgba(255,255,255,0.6);
      color: #111;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      padding: 0.4em 0.9em;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: none;
      width: auto;
      max-width: none;
      box-shadow: none;
      opacity: 0.98;
    }
    .btn-sub:hover, .btn-sub:focus {
      background: rgba(255,255,255,0.72);
      color: #111;
      border-color: rgba(255,255,255,0.45);
    }
    .btn:hover, .btn:focus {
      background: #fff;
      color: #111;
    }
    @media (orientation: landscape) and (min-width: 600px) {
      .btn-group {
        flex-direction: row;
        gap: 2.5rem;
        max-width: none;
        width: auto;
      }
      .btn {
        width: 220px;
        max-width: none;
      }
      .subnav {
        gap: 2.5rem;
      }
    }
    @media (max-width: 800px) {
      .bg-video { display: none; }
      .bg-image { display: block; }
    }
    @media (min-width: 801px) {
      .bg-video { display: block; }
      .bg-image { display: none; }
    }
    @media (max-width: 500px) {
      .btn {
        padding: 1em 0.5em;
        font-size: 1rem;
        max-width: 95vw;
      }
    }
    @media (max-width: 600px) {
      .content {
        max-width: 95vw;
        padding: 0 2vw;
      }
      h1 {
        font-size: 2rem;
        word-break: break-word;
        max-width: 100%;
        overflow-wrap: break-word;
      }
      .btn-group {
        width: 100%;
        max-width: 100vw;
      }
      .btn {
        box-sizing: border-box;
        width: 100%;
        max-width: 100vw;
        padding: 1em 0.5em;
        font-size: 1rem;
      }
      /* Keep subnav buttons compact and not full-width on small screens */
      .subnav { gap: 0.75rem; }
      .btn-sub {
        width: auto;
        max-width: none;
        padding: 0.35em 0.7em;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
      }
    }

    /* Make main buttons narrower/smaller on mobile portrait */
    @media (orientation: portrait) and (max-width: 600px) {
      .btn-group { gap: 1.2rem; }
      .btn-group .btn {
        width: 220px;            /* match landscape width */
        max-width: 80vw;         /* still responsive on very narrow screens */
        padding: 0.9em 1.2em;    /* slightly smaller padding */
        font-size: 1.05rem;      /* slightly smaller text */
      }
      /* Make app/subnav buttons distinctly smaller than main buttons */
      .subnav .btn-sub {
        width: auto;
        max-width: none;
        padding: 0.3em 0.6em;
        font-size: 0.78rem;
        letter-spacing: 0.03em;
      }
    }

    /* Animations */
    @keyframes bgFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* Apply subtle fades after initial styles so they take effect */
    .bg-video, .bg-image { opacity: 0; animation: bgFade 900ms ease-out forwards; }
    .content { animation: fadeInUp 800ms ease-out 150ms both; }
    @media (prefers-reduced-motion: reduce) {
      .bg-video, .bg-image, .content { animation: none !important; }
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay loop muted playsinline>

  </video>
  <img class="bg-image" src="lago_.jpg" alt="Mountain landscape, Mountainbike" />
  <div class="content">
    <h1>tiroltrailhead.com</h1>
    <div class="btn-group">
      <a class="btn" href="https://consulting.tiroltrailhead.com">Consulting</a>
      <a class="btn" href="https://guiding.tiroltrailhead.com">Guiding</a>
    </div>
    <div class="subnav">
      <a class="btn btn-sub" href="/apps.html">Apps</a>
      <a class="btn btn-sub" href="/webmaps.html">Webmaps</a>
    </div>
  </div>
  <footer class="footer-links">
    <a href="https://tiroltrailhead.com">©TirolTrailhead</a> | <a href="/terms_of_use.html">Terms</a> | <a href="/privacy_policy.html">Privacy</a>
  </footer>
</body>
</html>
